<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StormLens — Live Explorer</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <style>
    .explorer { display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 62px); }
    @media (max-width: 820px) { .explorer { grid-template-columns: 1fr; height: auto; } #map { height: 60vh; } }
    .side { border-right: 1px solid var(--border); background: var(--bg-2); overflow-y: auto; padding: 18px; }
    .side h2 { font-size: 18px; margin: 0 0 4px; }
    .side .muted { color: var(--muted); font-size: 13.5px; }
    .field { margin: 16px 0; }
    .field label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 6px; }
    select, .field input { width: 100%; padding: 10px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--border); color: var(--text); font-size: 14px; }
    #map { width: 100%; height: 100%; }
    .auth-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); }
    .dot.on { background: var(--good); }
    .item-list { display: grid; gap: 8px; margin-top: 8px; }
    .item { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font-size: 13px; cursor: pointer; }
    .item:hover { border-color: var(--accent); }
    .item b { display: block; font-size: 12.5px; }
    .item span { color: var(--muted); font-size: 11.5px; }
    .banner { background: linear-gradient(180deg, var(--panel-2), var(--bg-2)); border: 1px solid var(--border); border-left: 3px solid var(--accent-2); border-radius: 12px; padding: 12px 14px; color: var(--muted); font-size: 13px; margin-top: 10px; }
    .maplibregl-popup-content { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 10px; }
    .maplibregl-popup-content img { width: 220px; border-radius: 8px; display: block; margin-top: 6px; }
    .maplibregl-popup-close-button { color: var(--muted); }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="container">
      <a class="brand" href="index.html"><span class="logo">🛰️</span><span>StormLens<small>Weather intelligence for energy</small></span></a>
      <div class="nav-links">
        <a href="index.html">🏠 Home</a>
        <a href="weather.html">🌀 Weather Workflow</a>
        <a href="explorer.html" class="active">🗺️ Live Explorer</a>
        <a href="architecture.html">🏗️ Architecture</a>
        <a href="get-started.html">🚀 Get Started</a>
      </div>
    </div>
  </nav>

  <div class="explorer">
    <aside class="side">
      <h2>Live catalog explorer</h2>
      <div class="muted">Signed in with your Microsoft Entra identity — the same catalog, viewed through StormLens instead of the portal.</div>

      <div class="auth-row">
        <span id="authDot" class="dot"></span>
        <span id="authState" class="muted">Not signed in</span>
        <button id="authBtn" class="btn btn-ghost" style="margin-left:auto; padding:6px 12px; font-size:13px;">Sign in</button>
      </div>

      <div id="configBanner" class="banner hidden"></div>

      <div class="field">
        <label for="catalogUrl">GeoCatalog URL</label>
        <input id="catalogUrl" type="text" placeholder="https://<name>.<hash>.<region>.geocatalog.spatio.azure.com" />
      </div>

      <div class="field">
        <label for="collectionSelect">Collection</label>
        <select id="collectionSelect"><option value="">— sign in to load —</option></select>
      </div>

      <div class="field">
        <label>Items on map <span id="itemCount" class="muted"></span></label>
        <div id="itemList" class="item-list"></div>
      </div>
    </aside>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
  <script src="assets/app-config.js"></script>
  <script src="assets/explorer.js"></script>
</body>
</html>
