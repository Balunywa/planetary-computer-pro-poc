name: Azure Static Web Apps CI/CD

# Official Azure Static Web Apps deployment (Microsoft-recommended model):
# GitHub Actions builds the Vite app in pcp-web-sample/ and publishes it to the
# Static Web App. The SWA resource is provisioned by Bicep (deploy/azure); this
# workflow is the publisher. No workstation VM is involved in the web-app path.
#
# Required repository configuration (Settings -> Secrets and variables -> Actions):
#   Secret:   AZURE_STATIC_WEB_APPS_API_TOKEN  (the SWA deployment token: portal ->
#             your Static Web App -> Manage deployment token, or
#             `az staticwebapp secrets list -n <swa-name> --query properties.apiKey -o tsv`)
#   Variables (Entra client/tenant IDs are PUBLIC identifiers, not secrets):
#             VITE_GEOCATALOG_URL          (your GeoCatalog URI)
#             VITE_ENTRA_TENANT_ID         (directory/tenant ID)
#             VITE_ENTRA_CLIENT_ID         (SPA app registration client ID)
#             VITE_GEOCATALOG_API_VERSION  (optional; defaults to 2025-04-30-preview)

on:
  push:
    branches: [main]
    paths:
      - 'pcp-web-sample/**'
      - '.github/workflows/azure-static-web-apps.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - 'pcp-web-sample/**'
      - '.github/workflows/azure-static-web-apps.yml'
  # Allows the Azure deployment (deploymentScripts) to trigger the first build after it
  # wires up the token secret and VITE_* variables, and lets you re-run it on demand.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false
      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          # Vite bakes VITE_* into the bundle at build time.
          VITE_GEOCATALOG_URL: ${{ vars.VITE_GEOCATALOG_URL }}
          VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID }}
          VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
          VITE_GEOCATALOG_API_VERSION: ${{ vars.VITE_GEOCATALOG_API_VERSION || '2025-04-30-preview' }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: 'pcp-web-sample'
          api_location: ''
          output_location: 'dist'

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
